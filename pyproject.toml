[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qlgates"
version = "0.1.0"
description = "QL-bits and their minimal representation"
requires-python = ">=3.10"

dependencies = [
    "matplotlib==3.10.5",
    "networkx==3.2.1",
    "numpy==2.3.2",
    "scipy>=1.10",
]

[tool.setuptools]
packages = ["core"]
